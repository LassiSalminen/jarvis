# Hakee Garmin-kellodatan ja tyontaa sen Workerin KV-muistiin.
# Voi ajaa myos kasin: Actions -> Garmin sync -> Run workflow.
#
# Ajetaan kolmen tunnin valein. Tama EI yrita osua tiettyihin kellonaikoihin:
# GitHubin ajastusjono viivastyttaa ajoja tassa repossa johdonmukaisesti
# 2,5-3 tuntia (mitattu: cron 03:00 UTC -> ajot 05:35-06:06 UTC seitseman
# paivan ajan), joten tasmalliset kellonajat ovat saavuttamattomissa.
# Tiheampi vali ratkaisee oikean ongelman - data ei ole koskaan kovin vanhaa -
# riippumatta siita paljonko jono venyy.
#
# Skripti kierrattaa Garmin-istuntotokenin KV:n kautta, joten tiheampi ajo ei
# tarkoita kahdeksaa kirjautumista. Yksi ajo kestaa ~30 s.
#
# Tarkkaan hetkeen (esim. juuri ennen salia) kaytetaan sovelluksen
# SYNKKAA-nappia, joka laukaisee taman saman workflown heti.
name: Garmin sync

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install garminconnect
      - run: python scripts/garmin_sync.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          JARVIS_PIN: ${{ secrets.JARVIS_PIN }}
