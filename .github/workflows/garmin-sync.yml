# Hakee Garmin-kellodatan ja tyontaa sen Workerin KV-muistiin.
# Voi ajaa myos kasin: Actions -> Garmin sync -> Run workflow.
#
# Ajetaan 4x vuorokaudessa: aamulla yon uni ja treenivalmius, keskipaivalla ja
# illalla Body Battery ja paivan suoritukset ennen ja jalkeen salin, yolla
# paivan loppulukemat. Skripti kierrattaa Garmin-istuntotokenin KV:n kautta,
# joten tiheampi ajo ei tarkoita neljaa kirjautumista.
#
# Minuutti on 7 eika 0, koska tasatunnit ovat GitHubin ajastusjonon
# ruuhkaisimmat hetket ja ajo voi silloin myohastya kymmenia minuutteja.
name: Garmin sync

on:
  schedule:
    # 03:07, 09:07, 15:07, 21:07 UTC = klo 6, 12, 18 ja 24 Suomen kesaaikaa
    # (talviaikaan tunnin aiemmin - cron ei seuraa kesaaikaa)
    - cron: '7 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install garminconnect
      - run: python scripts/garmin_sync.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          JARVIS_PIN: ${{ secrets.JARVIS_PIN }}
